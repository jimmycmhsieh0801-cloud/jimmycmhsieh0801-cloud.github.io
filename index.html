<!DOCTYPE html>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0284c7;
      --primary-dark: #0369a1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;

      color: var(--text);
      line-height: 1.6;

    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-size: 1.7rem; margin: 0 0 8px; }
    header p { margin: 0; color: var(--muted); font-size: 0.96rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);

    .tag {

      background: #e0f2fe;
      color: var(--primary-dark);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;

    }
    .card h2 { font-size: 1.15rem; margin: 0 0 8px; }
    .card p { font-size: 0.9rem; color: var(--muted); margin: 0 0 16px; }
    .btn {

      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .btn:hover { background: var(--primary-dark); }
    footer { text-align: center; margin-top: 36px; font-size: 0.82rem; color: var(--muted); }

</html>
